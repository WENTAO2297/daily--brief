name: Generate daily brief

on:
  workflow_dispatch:
  schedule:
    # 07:30 Asia/Shanghai = 23:30 UTC on the previous day.
    - cron: "30 23 * * *"

permissions:
  contents: write

concurrency:
  group: daily-brief-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate and validate today's brief
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/generate_brief.py

      - name: Commit generated brief
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dist
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: update daily brief"
          git push origin HEAD:main
