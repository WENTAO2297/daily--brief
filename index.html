<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172d46">
  <meta name="description" content="每日新闻情报日报，浏览全球新闻、AI、科技、经济、日本与 CS2 的中文报道和来源。">
  <title>每日新闻情报日报</title>
  <link rel="stylesheet" href="./assets/newsroom.css?v=6">
  <script src="./assets/newsroom.js?v=6" defer></script>
</head>
<body>
  <a class="skip-link" href="#app">跳到正文</a>
  <header class="masthead">
    <div class="wrap masthead-inner">
      <div>
        <a class="wordmark" href="./">每日新闻情报日报</a>
        <p class="tagline">全球视野，中文简报</p>
      </div>
      <div class="masthead-tools">
        <time id="issue-date"></time>
        <a id="archive-link" class="archive-link" href="./?view=archive">往期日报</a>
      </div>
    </div>
  </header>
  <nav class="navigation" aria-label="新闻频道">
    <div class="wrap nav-scroll" id="channels"><a href="./">首页</a></div>
  </nav>
  <main class="wrap" id="app" tabindex="-1">
    <p class="loading" role="status">正在加载日报…</p>
    <noscript><p class="empty-state">请启用 JavaScript 查看日报。</p></noscript>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-inner"><span>每日新闻情报日报 · 整理自公开报道</span><a href="./?view=archive">浏览往期</a></div>
    <div class="wrap generation-usage" id="generation-usage" hidden></div>
  </footer>
</body>
</html>
